# Demonstration values. Generate real ones with `hubctl keygen` (hub) and
# `hubctl device add` (devices); keep upstream provider files in SOPS.
#
# No private key appears here on purpose. The hub only ever needs a device's public
# half, and an example private key invites being copied into a real deployment.
hub:
  endpoint: "vpn.example.com:51820"
  server_public_key: "W/kKaUP1n48AgIzxs8po0HKV+UEk1vMcTuBW648atSE="
  client_cidr: "10.80.0.0/24"
  dns_address: "10.80.0.1"
  awg_interface:
    Jc: "4"
    Jmin: "64"
    Jmax: "256"
  # Alternative ways in, for networks that block the ordinary UDP ingress. Both are
  # off unless stated here: each opens a port on the hub, and a listener nobody
  # asked for is attack surface rather than a feature.
  fallback:
    # Redirects UDP/443 arriving on the uplink to the ingress port, for networks
    # that block UDP/51820 by port rather than discarding UDP as such. The client
    # keeps its ordinary profile with the endpoint port changed; the bot issues that
    # second profile alongside the first.
    udp443: false
    # A TCP/443 VLESS listener for networks that discard UDP entirely. Clients are
    # proxy applications (v2rayNG, Hiddify, sing-box), not AmneziaWG peers, and the
    # bot hands out a vless:// link and QR code beside the usual profile.
    #
    # Needs a key: `hubctl keygen --reality` writes /etc/vpn-hub/reality.key.
    # Rotating it invalidates every link already issued.
    reality:
      enabled: false
      # The real TLS 1.3 site the handshake mimics, and which unauthenticated
      # connections are handed to. Pick somewhere plausible for this hub to talk to
      # and unrelated to it; it must not be the hub's own name.
      server_name: "www.example.com"

# One connection reaches everything: `egress` names the internet path, and the
# private networks below are reached in addition to it, chosen by destination.
devices:
  - id: macbook
    address: "10.80.0.2/32"
    public_key: "TE5crMJPBmCr2bF/uSbHqAlTAHKQwLKMs0RQxfQ0LU4="
    egress: awg-egress
  - id: phone
    address: "10.80.0.3/32"
    public_key: "6OUoSDjcaLflZn3V7U3aO6eW1Mn5HE4xPJYmzoVvnhU="
    egress: direct

tunnels:
  - id: corp-wg
    type: wireguard
    role: private-network
    source:
      kind: config
      value: "secrets/corp-wg.conf"
    routes: ["10.20.0.0/16"]
    dns_servers: ["10.20.0.53"]
    dns_zones: ["corp-a.internal"]
    health:
      tcp_address: "10.20.0.53:53"
  - id: corp-openvpn
    type: openvpn
    role: private-network
    source:
      kind: config
      value: "secrets/corp-openvpn.ovpn"
    routes: ["10.50.0.0/16"]
    dns_servers: ["10.50.0.53"]
    dns_zones: ["corp-b.internal"]
  - id: xray-egress
    type: xray
    role: egress
    # Disabled tunnels are dropped from the revision entirely, not built and left idle.
    enabled: false
    # The link lives in a file the host holds: an inline vless:// carries a UUID,
    # and a revision is written to disk.
    source:
      kind: config
      value: "secrets/xray-egress.link"
    health:
      https_url: "https://example.com/"
  - id: awg-egress
    type: amneziawg
    role: egress
    source:
      kind: config
      value: "secrets/awg-exit.conf"
