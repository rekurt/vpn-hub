name: release

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The binaries deployed to the hub are the ones CI built and tested, rather than
      # whatever happened to be on a workstation.
      - name: Build
        run: |
          version="${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o bin/linux/ ./cmd/...
          sha256sum bin/linux/* > bin/linux/SHA256SUMS
          cat bin/linux/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-hub-linux-amd64
          path: bin/linux/
          retention-days: 30

      - name: Publish a release for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" bin/linux/* --generate-notes
