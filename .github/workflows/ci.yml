name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...

      - name: Test
        run: go test -race ./...

      - name: Cross-compile for the hub
        run: GOOS=linux GOARCH=amd64 go build -trimpath -o bin/linux/ ./cmd/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v8 is the first release that understands the version 2 configuration format.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Drives the real production path -- plan builder, ingress adapter, nftables
  # adapter -- against a live kernel: a client in its own namespace, real rules, real
  # traffic. Uses plain WireGuard because AmneziaWG needs a DKMS build an ephemeral
  # runner cannot do; the obfuscation aside the protocol is identical, and none of the
  # hub machinery under test depends on it.
  #
  # Run inside the throwaway box rather than on the runner itself. The suite takes
  # ownership of the host's networking and removes the default route along the way --
  # deploy/testbox exists precisely to give it a host it may break, and a runner is
  # not one: the agent reporting back to GitHub lives on it, so the run that dropped
  # the route dropped the agent with it. That is why every one of these jobs died
  # around the hour mark with no logs and without `-timeout 15m` ever firing -- the
  # suite was still running, but nothing was left to carry its output home. The box
  # installs the same packages and the same pinned sing-box the runner used to, so
  # what is exercised does not change.
  integration:
    runs-on: ubuntu-latest
    # The suite bounds itself with `go test -timeout 15m`; this bounds everything
    # around it. A runner that stops answering is not failed until GitHub gives up on
    # it an hour later, and that hour was being spent on every push.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No tooling step: the box builds its own Go, packages and sing-box, sets
      # forwarding and rp_filter and stands the FORWARD policy down inside itself,
      # and fails the run itself when a scenario skipped for a missing package.
      - name: Integration tests
        run: deploy/testbox/run.sh

      # The runner outlives the suite now, so a failure can leave its full output
      # behind -- which is the one thing the host-side runs never managed.
      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: /tmp/vpn-hub-testbox.log
          if-no-files-found: ignore

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Check formatting
        run: tofu -chdir=deploy/terraform fmt -check -diff
      - name: Validate
        # No credentials are needed: validation does not contact the provider API.
        run: |
          tofu -chdir=deploy/terraform init -backend=false
          tofu -chdir=deploy/terraform validate
