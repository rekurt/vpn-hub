name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...

      - name: Test
        run: go test -race ./...

      - name: Cross-compile for the hub
        run: GOOS=linux GOARCH=amd64 go build -trimpath -o bin/linux/ ./cmd/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v8 is the first release that understands the version 2 configuration format.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Drives the real production path -- plan builder, ingress adapter, nftables
  # adapter -- against a live kernel: a client in its own namespace, real rules, real
  # traffic. Uses plain WireGuard because AmneziaWG needs a DKMS build an ephemeral
  # runner cannot do; the obfuscation aside the protocol is identical, and none of the
  # hub machinery under test depends on it.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install network tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools nftables jq conntrack microsocks

      # The proxy path needs sing-box, which is not in the archive. Same release and
      # checksum the hub installs, so CI exercises what the host runs.
      - name: Install sing-box
        run: |
          version=1.11.15
          archive="sing-box-${version}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/SagerNet/sing-box/releases/download/v${version}/${archive}"
          echo "950af37eb2d7e55dddae34a18411cd617303fd99d2dc75bc76b6dd9fcd97d9c5  ${archive}" | sha256sum -c -
          tar xzf "${archive}"
          sudo install -m 0755 "sing-box-${version}-linux-amd64/sing-box" /usr/local/bin/sing-box

      - name: Enable forwarding
        run: sudo sysctl -w net.ipv4.ip_forward=1

      # Runners ship Docker, which sets the iptables filter FORWARD policy to DROP.
      # Netfilter runs every chain registered on a hook, so that DROP kills forwarded
      # packets regardless of what the hub's own table accepts. The hub assumes it
      # owns forwarding on its host; this makes the runner match that assumption.
      - name: Stand down the competing FORWARD policy
        run: |
          sudo iptables -P FORWARD ACCEPT || true
          sudo ip6tables -P FORWARD ACCEPT || true

      # -v so a scenario that skipped itself is visible. A skip reads as a pass in
      # the summary, and a test skipped for a missing binary is a test that has never
      # run at all.
      - name: Integration tests
        run: |
          # pipefail, or tee's exit status hides a failing test behind a successful
          # copy of its output.
          set -o pipefail
          sudo -E env "PATH=$PATH" go test -tags=integration -count=1 -timeout 15m -v \
            ./internal/adapters/linux/ 2>&1 | tee /tmp/integration.log

      # A scenario that skips because a package is missing has never run, and a skip
      # reads as a pass in the summary -- so the runner not having what the tests need
      # is a build failure, not a quiet note. Skips for an unreachable network are
      # left alone: those say something about the runner's connectivity, not about
      # whether the hub works, and failing on them would only make CI flap.
      - name: Fail if a scenario skipped for a missing package
        run: |
          if grep -q "is not installed" /tmp/integration.log; then
            echo "the runner is missing something the tests need:"
            grep "is not installed" /tmp/integration.log
            exit 1
          fi
          grep -- "--- SKIP" /tmp/integration.log || echo "no scenario skipped itself"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Check formatting
        run: tofu -chdir=deploy/terraform fmt -check -diff
      - name: Validate
        # No credentials are needed: validation does not contact the provider API.
        run: |
          tofu -chdir=deploy/terraform init -backend=false
          tofu -chdir=deploy/terraform validate
