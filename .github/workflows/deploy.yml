name: deploy

# Deployment is deliberately manual. The hub is the gateway for the operator's own
# traffic, so a push to master must not be able to reconfigure it: an automatic deploy
# would mean a compromised token is a compromised network path. Running this workflow
# is an explicit decision, and the `hub` environment is where an approval requirement
# and the secrets belong.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release run ID to deploy (blank builds from this ref)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: inputs.run_id == ''
        with:
          go-version-file: go.mod
          cache: true

      - name: Build from this ref
        if: inputs.run_id == ''
        run: GOOS=linux GOARCH=amd64 go build -trimpath -o bin/linux/ ./cmd/...

      - name: Download a previously built artifact
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: vpn-hub-linux-amd64
          path: bin/linux/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Authorise against the hub
        env:
          SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
          HUB_HOST: ${{ secrets.HUB_HOST }}
          HUB_HOST_KEY: ${{ secrets.HUB_HOST_KEY }}
        run: |
          test -n "$SSH_KEY"  || { echo "secret HUB_SSH_KEY is not set"; exit 1; }
          test -n "$HUB_HOST" || { echo "secret HUB_HOST is not set"; exit 1; }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The host key is pinned, not learned at deploy time. `ssh-keyscan` accepts
          # whatever answers, so a hijacked name or a MITM on the runner's path would
          # be handed this root key -- and the binaries. That defeats the reason this
          # workflow is manual in the first place: a stolen token should not amount to
          # a stolen network path.
          test -n "$HUB_HOST_KEY" || {
            echo "secret HUB_HOST_KEY is not set; get it with: ssh-keyscan <host>"; exit 1; }
          printf '%s\n' "$HUB_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The bot's credentials live as environment secrets and are installed by the
      # deploy, so provisioning a hub never involves pasting a token over SSH by
      # hand. The content travels on stdin: an argv would be visible to every
      # process on the host for as long as the command runs, and a heredoc in the
      # remote command would land in the shell history. When the secrets are not
      # set, whatever telegram.yaml the host already has is left alone, so a
      # hand-managed file keeps working.
      - name: Provision the bot configuration
        env:
          HUB_HOST: ${{ secrets.HUB_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_NOTIFICATIONS: ${{ secrets.TELEGRAM_NOTIFICATIONS }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$TELEGRAM_ADMIN_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_ADMIN_ID are not set; leaving telegram.yaml on the host as it is"
            exit 0
          fi
          # Half a configuration is worse than none: the bot would crash-loop and
          # fail the deploy without saying which secret is missing.
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "secret TELEGRAM_BOT_TOKEN is not set"; exit 1; }
          test -n "$TELEGRAM_ADMIN_ID"  || { echo "secret TELEGRAM_ADMIN_ID is not set"; exit 1; }
          case "$TELEGRAM_ADMIN_ID" in
            *[!0-9]*) echo "TELEGRAM_ADMIN_ID must be a numeric Telegram user id"; exit 1 ;;
          esac
          {
            printf 'token: "%s"\n' "$TELEGRAM_BOT_TOKEN"
            printf 'admin_id: %s\n' "$TELEGRAM_ADMIN_ID"
            if [ -n "$TELEGRAM_NOTIFICATIONS" ]; then
              printf 'notifications:\n'
              printf '%s\n' "$TELEGRAM_NOTIFICATIONS" | sed 's/^/  /'
            fi
          } | ssh root@"$HUB_HOST" '
            set -e
            umask 077
            # A trap clears the temp file if ssh dies mid-write, so a partial token
            # never lingers in /etc/vpn-hub; the mv itself is atomic.
            trap "rm -f /etc/vpn-hub/telegram.yaml.tmp" EXIT
            cat > /etc/vpn-hub/telegram.yaml.tmp
            mv /etc/vpn-hub/telegram.yaml.tmp /etc/vpn-hub/telegram.yaml
          '

      - name: Install
        env:
          HUB_HOST: ${{ secrets.HUB_HOST }}
        run: |
          # A previously built artifact (the run_id rollback path) may predate the
          # bot; deploying it must still work, it just does not ship a bot.
          chmod +x bin/linux/hubctl bin/linux/vpn-hub-agent
          BINARIES="bin/linux/hubctl bin/linux/vpn-hub-agent"
          if [ -f bin/linux/vpn-hub-bot ]; then
            chmod +x bin/linux/vpn-hub-bot
            BINARIES="$BINARIES bin/linux/vpn-hub-bot"
          fi
          # Staged first: scp cannot overwrite a running executable (ETXTBSY), while
          # install replaces the directory entry and leaves the running process alone
          # until it restarts. The procedure itself is deploy/install.sh -- the same
          # script `make deploy-lab` runs, so the two paths cannot drift.
          # Emptied, not just created: an install that aborted before its final
          # cleanup leaves its binaries behind, and a rollback to an artifact that
          # predates the bot would copy no bot while install.sh still found and
          # installed the stale one -- mixing versions on a hub deployed precisely
          # to get away from one of them.
          ssh root@"$HUB_HOST" 'rm -rf /run/vpn-hub-stage && mkdir -p /run/vpn-hub-stage/systemd'
          scp $BINARIES deploy/install.sh root@"$HUB_HOST":/run/vpn-hub-stage/
          scp deploy/systemd/vpn-hub-agent.service deploy/systemd/vpn-hub-bot.service root@"$HUB_HOST":/run/vpn-hub-stage/systemd/
          ssh root@"$HUB_HOST" 'sh /run/vpn-hub-stage/install.sh'

      # A deploy that leaves the agent crash-looping is a failed deploy, so say so
      # here rather than letting it be discovered later.
      - name: Verify the agent converged
        env:
          HUB_HOST: ${{ secrets.HUB_HOST }}
        run: |
          sleep 5
          ssh root@"$HUB_HOST" '
            systemctl is-active --quiet vpn-hub-agent || {
              echo "agent is not running:"; journalctl -u vpn-hub-agent -n 30 --no-pager; exit 1; }
            hubctl --help >/dev/null
            if [ -f /etc/vpn-hub/telegram.yaml ] && [ -x /usr/local/bin/vpn-hub-bot ]; then
              # check validates the configuration and proves the token against the
              # Bot API, so a bad secret fails the deploy here with the reason,
              # not later as a crash-looping unit.
              vpn-hub-bot check || { echo "bot configuration or token is broken"; exit 1; }
              systemctl is-active --quiet vpn-hub-bot || {
                echo "bot is not running:"; journalctl -u vpn-hub-bot -n 30 --no-pager; exit 1; }
            fi
            echo "--- recent agent log ---"
            journalctl -u vpn-hub-agent -n 10 --no-pager
          '
