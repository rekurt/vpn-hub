name: publish documentation

on:
  push:
    branches: [master]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out family kit
        uses: actions/checkout@v7
        with:
          repository: rekurt/rekurt.github.io
          ref: main
          path: family
      - uses: actions/setup-go@v7
        with:
          go-version-file: family/go.mod
          cache-dependency-path: family/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the static site
        working-directory: site
        run: |
          npm ci
          npm run verify:content
          npm run build
          npm run verify:landing
          npm run test:built-site
      - name: Refresh public catalog
        working-directory: family
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/catalog-sync sync --manifest catalog/projects.yaml --snapshot site/src/data/generated/catalog.json --audit docs/repository-audit.md
      - name: Add project family navigation
        working-directory: family
        run: >-
          go run ./cmd/project-site decorate
          --slug vpn-hub
          --snapshot site/src/data/generated/catalog.json
          --repo ..
          --out ../site/dist
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Validate decorated website
        working-directory: family
        run: >-
          go run ./cmd/project-site validate
          --slug vpn-hub
          --snapshot site/src/data/generated/catalog.json
          --repo ..
          --out ../site/dist
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
