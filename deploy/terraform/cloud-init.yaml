#cloud-config
# First-boot provisioning for the vpn-hub host. This prepares the operating system
# only; the hubctl/vpn-hub-agent binaries and their systemd unit are installed
# separately by `make deploy-lab`, because they change on every build.

hostname: vpn-hub
package_update: true
package_upgrade: true

packages:
  - nftables
  - conntrack
  - wireguard-tools
  - iproute2
  - dkms
  - software-properties-common
  - python3-launchpadlib
  - gnupg2
  - ca-certificates
  - curl
  - jq
  - qrencode
  - openvpn
  - microsocks
  # The agent starts a resolver on every pass; without this it fails on every pass.
  - dnsmasq

write_files:
  - path: /etc/sysctl.d/99-vpn-hub.conf
    permissions: '0644'
    content: |
      # The hub forwards between the client subnet and every egress namespace.
      net.ipv4.ip_forward = 1

      # IPv6 is blocked by policy. There is no IPv6 egress path, so leaving it enabled
      # would let traffic leave the host directly, bypassing every tunnel.
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1

      # Loose mode: with policy routing, return traffic legitimately arrives on an
      # interface other than the one strict reverse-path filtering would expect.
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2

  - path: /usr/lib/tmpfiles.d/vpn-hub.conf
    permissions: '0644'
    content: |
      # `ip netns add` bind-mounts namespace handles here, and the agent runs with
      # ProtectSystem=strict, so the directory must exist before the unit starts.
      d /run/netns 0755 root root -

  - path: /etc/ssh/sshd_config.d/99-vpn-hub.conf
    permissions: '0600'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password

  - path: /usr/local/sbin/vpn-hub-bootstrap
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Idempotent: safe to re-run by hand when a step needs to be retried.
      set -euo pipefail

      # unattended-upgrades holds the dpkg lock on a freshly booted image.
      apt_get() { DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 "$@"; }

      echo "==> kernel headers for $(uname -r)"
      apt_get install -y "linux-headers-$(uname -r)"

      echo "==> AmneziaWG from the Amnezia PPA"
      add-apt-repository -y ppa:amnezia/ppa
      apt_get update
      # `amneziawg` is a metapackage; fall back to the individual packages if the
      # archive layout changes.
      apt_get install -y amneziawg amneziawg-tools \
        || apt_get install -y amneziawg-dkms amneziawg-tools

      echo "==> load the module and make it persistent"
      modprobe amneziawg
      echo amneziawg > /etc/modules-load.d/amneziawg.conf

      echo "==> sing-box for proxy egress"
      # Not in the Ubuntu archive, so it comes from a GitHub release -- with its
      # checksum verified. Installing an unverified binary on the machine that
      # carries all of a person's traffic is not a shortcut worth taking.
      SINGBOX_VERSION="1.11.15"
      SINGBOX_SHA256="950af37eb2d7e55dddae34a18411cd617303fd99d2dc75bc76b6dd9fcd97d9c5"
      SINGBOX_TGZ="sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
      cd /tmp
      curl -fsSLO "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${SINGBOX_TGZ}"
      if ! echo "${SINGBOX_SHA256}  ${SINGBOX_TGZ}" | sha256sum -c -; then
        echo "sing-box checksum mismatch; refusing to install" >&2
        rm -f "${SINGBOX_TGZ}"
        exit 1
      fi
      tar xzf "${SINGBOX_TGZ}"
      install -m 0755 "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
      rm -rf "${SINGBOX_TGZ}" "sing-box-${SINGBOX_VERSION}-linux-amd64"
      sing-box version | head -1

      echo "==> hand the firewall to the agent"
      # ufw and the distro nftables unit both install their own rulesets and would
      # fight the agent, which owns the `inet vpn_hub` table and reinstalls it on
      # every start. Persistence across reboots is the agent's job, not theirs.
      systemctl disable --now ufw          2>/dev/null || true
      systemctl disable --now nftables     2>/dev/null || true
      # The packaged dnsmasq would take port 53 and the agent's own instances could
      # not bind. The agent runs its resolvers as transient units, in the namespaces
      # they belong in; the package is here for the binary alone.
      systemctl disable --now dnsmasq      2>/dev/null || true

      echo "==> directories owned by the hub"
      install -d -m 0700 /var/lib/vpn-hub
      install -d -m 0755 /etc/vpn-hub

      echo "==> bootstrap complete"

runcmd:
  - [ sysctl, --system ]
  - [ systemd-tmpfiles, --create ]
  - [ /usr/local/sbin/vpn-hub-bootstrap ]
  - [ systemctl, restart, ssh ]

final_message: "vpn-hub host provisioned after $UPTIME seconds"
